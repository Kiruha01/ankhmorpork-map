name: Build PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-preview-build-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build preview
        run: npm run build -- --base=/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/

      - name: Prepare preview artifact
        env:
          PR_NUMBER: ${{ github.event.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
        run: |
          mkdir -p preview-artifact/site
          cp -R dist/. preview-artifact/site/
          node -e "require('fs').writeFileSync('preview-artifact/metadata.json', JSON.stringify({number: Number(process.env.PR_NUMBER), headSha: process.env.PR_HEAD_SHA, headRepoId: Number(process.env.PR_HEAD_REPO_ID), runId: Number(process.env.GITHUB_RUN_ID)}))"

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview
          path: preview-artifact/
          if-no-files-found: error
          retention-days: 3
